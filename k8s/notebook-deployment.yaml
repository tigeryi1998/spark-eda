apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-eda-notebook
  labels:
    app: spark-eda-notebook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-eda-notebook
  template:
    metadata:
      labels:
        app: spark-eda-notebook
    spec:
      containers:
        - name: spark-eda-notebook
          image: image-registry.openshift-image-registry.svc:5000/ds551-2025fall-cb9303/spark-eda-notebook:latest
          imagePullPolicy: Always

          command: ["jupyter", "lab"]
          args:
            - "--ip=0.0.0.0"
            - "--port=8888"
            - "--no-browser"
            - "--NotebookApp.token="
            - "--NotebookApp.password="

          ports:
            - name: jupyter
              containerPort: 8888
            - name: spark-ui
              containerPort: 4040

          env:
            # Kafka
            - name: KAFKA_BROKER
              value: kafka:9092
            - name: KAFKA_TOPIC
              value: customer

            # PySpark / Python
            - name: PYSPARK_PYTHON
              value: python3
            - name: PYSPARK_DRIVER_PYTHON
              value: jupyter

            # Writable dirs for Spark and Jupyter
            - name: SPARK_LOCAL_DIRS
              value: /tmp/spark
            - name: SPARK_SCALA_LOCAL_DIRS
              value: /tmp/spark
            - name: SPARK_WORKER_DIR
              value: /tmp/spark
            - name: IVY_HOME
              value: /tmp/.ivy2
            # - name: JUPYTER_RUNTIME_DIR
            #   value: /tmp/jupyter-runtime
            # - name: JUPYTER_CONFIG_DIR
            #   value: /tmp/jupyter-config
            # - name: JUPYTER_DATA_DIR
            #   value: /tmp/jupyter-data
            # - name: IPYTHONDIR
            #   value: /tmp/.ipython

          volumeMounts:
            - name: spark-temp
              mountPath: /tmp/spark
            - name: ivy-cache
              mountPath: /tmp/.ivy2
            # - name: jupyter-runtime
            #   mountPath: /tmp/jupyter-runtime
            # - name: jupyter-config
            #   mountPath: /tmp/jupyter-config
            # - name: jupyter-data
            #   mountPath: /tmp/jupyter-data
            # - name: ipython-dir
            #   mountPath: /tmp/.ipython
            
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          readinessProbe:
            httpGet:
              path: "/api/status"
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2

          livenessProbe:
            httpGet:
              path: "/api/status"
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2

      volumes:
        - name: spark-temp
          emptyDir: {}
        - name: ivy-cache
          emptyDir: {}
        # - name: jupyter-runtime
        #   emptyDir: {}
        # - name: jupyter-config
        #   emptyDir: {}
        # - name: jupyter-data
        #   emptyDir: {}
        # - name: ipython-dir
        #   emptyDir: {}

      restartPolicy: Always
      terminationGracePeriodSeconds: 60
