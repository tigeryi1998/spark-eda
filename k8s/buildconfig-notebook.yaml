# buildconfig-notebook.yaml

apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: spark-eda-notebook
  labels:
    app: spark-eda-notebook
spec:
  lookupPolicy:
    local: true
  tags:
    - name: latest
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: spark-eda-notebook
  labels:
    app: spark-eda-notebook
spec:
  output:
    to:
      kind: ImageStreamTag
      name: spark-eda-notebook:latest
  source:
    type: Git
    git:
      uri: https://github.com/tigeryi1998/spark-eda
    contextDir: .
    sourceSecret:
      name: ds551 # Replace with your actual secret name if needed
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: eda/Containerfile
  triggers:
    - type: ConfigChange
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5
